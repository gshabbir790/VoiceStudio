name: voice_studio
description: "Voice Studio — AI voice-over studio powered by Google Gemini TTS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Local, per-device storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Google Sign-In (identity only — confirms which Google account the
  # person is using; actual Gemini quota is billed to the API key
  # generated from that same account, see README)
  google_sign_in: ^6.2.1

  # Audio playback of generated voice-overs
  audioplayers: ^6.1.0

  # Small UI helpers
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  intl: ^0.19.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0F1A"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B0F1A"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B0F1A"
    image: assets/icon/splash_logo.png
  android: true
  ios: false
