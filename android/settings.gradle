pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootProject.projectDir, "local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def sdkPath = properties.getProperty("flutter.sdk")

        // Agar local.properties mein path na mile toh environment variable use karein
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT")
        }

        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            throw new GradleException(
                "Flutter SDK path not found. " +
                "Please set flutter.sdk in android/local.properties " +
                "or define FLUTTER_ROOT environment variable."
            )
        }

        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

rootProject.name = "voice_studio"
include ":app"
