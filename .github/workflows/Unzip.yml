name: Unzip Voice Studio Flutter and Push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Voice Studio ZIP
        run: |
          echo "Searching for voice_studio_flutter.zip..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "voice_studio_flutter.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: voice_studio_flutter.zip not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

      - name: Unzip Voice Studio Flutter
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "voice_studio_flutter.zip" | head -n 1)

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting project..."

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

          find extracted -maxdepth 3 -type f | head -200

      - name: Detect Flutter project
        run: |
          SOURCE=""

          if [ -f "extracted/pubspec.yaml" ]; then
            SOURCE="extracted"

          elif [ -f "extracted/voice_studio_flutter/pubspec.yaml" ]; then
            SOURCE="extracted/voice_studio_flutter"

          elif [ -f "extracted/voice_studio_flutter-main/pubspec.yaml" ]; then
            SOURCE="extracted/voice_studio_flutter-main"

          elif [ -f "extracted/VoiceStudio/pubspec.yaml" ]; then
            SOURCE="extracted/VoiceStudio"

          else
            echo "ERROR: pubspec.yaml not found."

            echo "Searching:"
            find extracted -name pubspec.yaml -print

            exit 1
          fi

          echo "Flutter project detected at:"
          echo "$SOURCE"

          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Copy complete project
        run: |
          shopt -s dotglob nullglob

          echo "Copying COMPLETE project..."

          cp -a "$SOURCE"/. .

          echo "Complete project copied."

      - name: Remove extraction folder
        run: |
          rm -rf extracted

      - name: Remove source ZIP
        run: |
          find . -maxdepth 2 -type f \
            -iname "voice_studio_flutter.zip" \
            -delete

          echo "Source ZIP removed."

      - name: Verify complete project
        run: |
          echo "Checking Flutter project..."

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "pubspec.yaml: OK"
          echo "lib/: OK"
          echo "android/: OK"

          echo ""
          echo "Workflow files from ZIP:"

          if [ -d ".github/workflows" ]; then
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print
          fi

          echo ""
          echo "Project structure:"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort | head -300

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit complete project
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import complete Voice Studio Flutter project"

      - name: Push complete project using PAT
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_TOKEN secret is not configured."
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/gshabbir790/VoiceStudio.git"

          git push origin HEAD:main
