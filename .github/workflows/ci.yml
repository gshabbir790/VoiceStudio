name: CI - Voice Studio Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Flutter SDK setup
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # 2. FLUTTER_ROOT target karke local.properties create karna
      - name: Configure Flutter SDK Path
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          cat local.properties

      # 3. Flutter dependencies fetch karna
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 4. Gradle tool setup
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Wrapper Generate & Build Execution
      - name: Build Android APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type all
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
