name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Gradle 8.13 wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build universal APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build App Bundle
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          echo 'Release outputs:'
          ls -lh build/app/outputs/flutter-apk/*.apk
          ls -lh build/app/outputs/bundle/release/*.aab

      - name: Determine release name
        id: ver
        run: echo "name=${GITHUB_REF_NAME:-manual-build}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_name || steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
